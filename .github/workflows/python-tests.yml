name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            analysis/requirements.txt
            requirements-dev.txt
            requirements-tester-app.txt
            requirements-packaging.txt
      - name: Install test and license dependencies
        run: |
          python -m pip install -r analysis/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-packaging.txt
      - name: Run analysis tests
        run: python -m unittest discover -s analysis/tests -p "test_*.py" -v
      - name: Run beta tester assistant tests
        run: python -m unittest discover -s tester_assistant_tests -p "test_*.py" -v
      - name: Run packaging configuration tests
        run: python -m unittest scripts.tests.test_build_tester_assistant -v
      - name: Run repository and release-audit tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
      - name: Enforce repository policy
        run: python scripts/repository_policy.py
      - name: Run release audit
        run: python scripts/release_audit.py
      - name: Validate license mapping
        run: python -m reuse lint

  package-assistant:
    if: github.event_name == 'workflow_dispatch'
    needs: python-tests
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned packaging dependencies
        run: python -m pip install -r requirements-packaging.txt
      - name: Build one-folder assistant without assignment data
        shell: pwsh
        run: ./scripts/build-tester-assistant.ps1 -OutputDirectory "$env:RUNNER_TEMP\rinklogic-beta7-package"
      - name: Run packaged offline self-check
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\rinklogic-beta7-package\RinkLogic-Beta7-Test-Assistant\RinkLogic-Beta7-Test-Assistant.exe" --self-check'
      - name: Verify local distribution checksums exist
        shell: pwsh
        run: if (-not (Test-Path "$env:RUNNER_TEMP\rinklogic-beta7-package\RinkLogic-Beta7-Test-Assistant\SHA256SUMS.txt")) { throw 'SHA256SUMS.txt is missing.' }
